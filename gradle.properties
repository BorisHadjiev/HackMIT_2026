# ---------------------------------------------------------------------------
# Rename the app here. No code changes required for a display-name change.
#   APP_NAME : the label shown on the launcher / UI
#   APP_ID   : the Android applicationId (package installed on the device)
# Use tools/rename.sh for a one-command rename.
# ---------------------------------------------------------------------------
APP_NAME=StrokeSense
APP_ID=com.hackmit.strokesense

# Deepgram proxy base URL (no query string). When set, the app streams audio to
# this backend endpoint instead of Deepgram directly, and authenticates with the
# care-alert gateway token. Can be overridden per-device in local.properties.
DEEPGRAM_PROXY_URL=wss://work.tail043976.ts.net/v1/deepgram/stream

# Backend gateway used for voice (TTS), the Deepgram proxy, and care alerts.
# GATEWAY_TOKEN is a shared demo secret — put the real value in the gitignored
# local.properties, not here.
GATEWAY_BASE_URL=https://work.tail043976.ts.net
GATEWAY_TOKEN=

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
